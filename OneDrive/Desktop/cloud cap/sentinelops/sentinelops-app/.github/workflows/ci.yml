name: CI

on:
  push:
    branches: [main]
  pull_request: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./... -race -coverprofile=coverage.out

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan:
    runs-on: ubuntu-latest
    needs: [test, secrets]
    strategy:
      matrix:
        service: [api-gateway, catalog, orders, payments, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Syft SBOM generation
        uses: anchore/syft-action@0.91.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          output: sbom.spdx.json
          format: spdx-json
      - name: Cosign keyless sign
        uses: sigstore/cosign-action@3.3.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}

  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-scan
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: sanjuportfolio/sentinelops-gitops
          token: ${{ secrets.GITHUB_TOKEN }}
          path: sentinelops-gitops

      - name: Set image digest in GitOps overlay
        working-directory: sentinelops-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          kustomize edit set image ghcr.io/sanjuportfolio/sentinelops-app/services/catalog=ghcr.io/sanjuportfolio/sentinelops-app/services/catalog:sha-${GITHUB_SHA::7}
          git add -A
          git commit -m "chore: promote catalog to sha-${GITHUB_SHA::7}"
          git push

      - name: Open commit/PR -> ArgoCD syncs
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: promote catalog to sha-${GITHUB_SHA::7}"
          title: "chore: promote catalog to sha-${GITHUB_SHA::7}"
          body: "Automated promotion triggered by CI run ${{ github.sha }}."
          branch: promote/catalog-sha-${GITHUB_SHA::7}
          path: sentinelops-gitops
          labels: |
            automated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

