---
- name: Install and harden the SentinelOps k3s cluster
  hosts: k3s
  become: true

  tasks:
    - name: Install base hardening packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart sshd

    - name: Allow SSH, HTTP, HTTPS and k3s from anywhere
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: sentinelops
      loop:
        - { port: "22",   comment: ssh }
        - { port: "80" ,   comment: http }
        - { port: "443",  comment: https }
        - { port: "6443", comment: kubernetes-api }
      state: enabled

    - name: Install k3s via the official script
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s -
      args:
        creates: /var/lib/rancher/k3s/server/bin/k3s

    - name: Enable strict k3s install (no Traefik, we use Istio ingress)
      ansible.builtin.lineinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        mode: "0644"
        line: "disableTraefik: true"

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/server-ready
        state: present

  handlers:
    - name: restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
        enabled: true
        daemon_reload: true
