apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinelops-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sanjuportfolio/sentinelops-gitops.git
    targetRevision: HEAD
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
