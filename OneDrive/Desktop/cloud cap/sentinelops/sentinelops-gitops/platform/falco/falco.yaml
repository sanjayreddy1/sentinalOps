apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: falco
spec:
  project: default
  source:
    repoURL: https://falco.org/charts
    chart: falco
    chartVersion: 2.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
