apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    receivers:
      - name: default
      - name: ops-webhook
        webhook_configs:
          - url: http://sentinelops-console-backend:8000/api/remediations/webhook
            send_resolved: true
    route:
      receiver: ops-webhook
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: ops-webhook
          match:
            alertname: [HighErrorRate, PodCrashLooping, NodeNotReady, ResourceExhausted]
          continue: false
    inhibit_rules:
      - sourceMatch:
          alertname: HighErrorRate
        targetMatch:
          alertname: PodCrashLooping
        equal: [namespace, deployment]
