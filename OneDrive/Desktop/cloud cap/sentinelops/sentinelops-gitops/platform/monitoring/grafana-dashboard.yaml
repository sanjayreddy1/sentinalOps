apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sentinelops
  namespace: monitoring
data:
  sentinelops-dashboard.json: |
    {
      "dashboard": {
        "id": 1,
        "title": "SentinelOps Overview",
        "timezone": "browser",
        "panels": [
          {
            "type": "timeseries",
            "title": "Request rate (req/s)",
            "targets": [
              {
                "expr": "sum(rate(orders_requests_total[5m]))",
                "legendFormat": "orders"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "Error rate",
            "targets": [
              {
                "expr": "sum(rate(orders_requests_total{status!=\"200\"}[5m])) / sum(rate(orders_requests_total[5m]))",
                "legendFormat": "error ratio"
              }
            ]
          }
        ]
      },
      "overwrite": true
    }
