apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentinelops-orders
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: orders
  namespaceSelector:
    names:
      - sentinelops
  endpoints:
    - port: 8080
      path: /metrics
      interval: 30s
---
