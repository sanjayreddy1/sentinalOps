apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  sentinelops-realm.json: |
    {
      "realm": "sentinelops",
      "displayName": "SentinelOps",
      "enabled": true,
      "registrationEnabled": false,
      "loginWithUsername": true,
      "users": [
        {
          "username": "admin",
          "password": "admin",
          "enabled": true,
          "roles": ["admin"]
        },
        {
          "username": "developer",
          "password": "developer",
          "enabled": true,
          "roles": ["developer"]
        },
        {
          "username": "viewer",
          "password": "viewer",
          "enabled": true,
          "roles": ["viewer"]
        }
      ],
      "clients": [
        {
          "clientId": "sentinelops-console",
          "protocol": "openid-connect",
          "publicClient": true,
          "redirectUris": ["http://localhost:5173/*"],
          "webOrigins": ["http://localhost:5173"],
          "attributes": {
            "post.logout.redirect.uris": ["http://localhost:5173"]
          }
        },
        {
          "clientId": "sentinelops-api",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "console-backend-secret"
        }
      ],
      "roles": {
        "realm": {
          "admin": ["admin"],
          "developer": ["developer"],
          "viewer": ["viewer"]
        }
      }
    }
