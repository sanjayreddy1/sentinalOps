apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: keda
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    chartVersion: 2.17.0
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
