apiVersion: argoproj.io/rollouts.argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-rollout
  namespace: sentinelops
spec:
  strategy:
    canary:
      analysis:
        templates:
          - templateName: success-rate
      steps:
        - setWeight: 10
        - pause:
            duration: 60
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 30
        - pause:
            duration: 60
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 60
        - pause:
            duration: 60
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 100
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: ghcr.io/sanjuportfolio/sentinelops-app/services/orders:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: argoproj.io/rollouts.argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: sentinelops
spec:
  metrics:
    - name: success-rate
      successCondition: result >= 0.99
      provider:
        prometheus:
          query: |
            (sum(rate(orders_requests_total{status!="200"}[5m])) / sum(rate(orders_requests_total[5m]))) >= 0.99
